<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allalyze</title>

  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      color: #fff;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    header {
      padding: 60px 20px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    p {
      color: #ddd;
      font-size: 1.3rem;
    }

    .button-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      margin-top: 60px;
      padding-bottom: 100px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    input[type="file"] {
      background: #ffffff;
      padding: 8px;
      border-radius: 6px;
      color: #000;
      width: 220px;
      cursor: pointer;
    }

    .analysis-btn {
      background: #fbfaf9d1;
      border: 2px solid #e94560;
      border-radius: 12px;
      color: #000;
      padding: 16px 24px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 220px;
      text-transform: uppercase;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(233, 69, 96, 0.3);
    }

    .analysis-btn:hover {
      background: #e94560;
      color: #fff;
      transform: scale(1.08);
      box-shadow: 0 6px 20px rgba(233, 69, 69, 0.5);
    }

    footer {
      background: #148d7b;
      color: #ccc;
      padding: 15px 0;
      position: fixed;
      width: 100%;
      bottom: 0;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

<header>
  <h1>AI Data Analysis Hub</h1>
  <p>Analyze your files instantly — choose the type of content to begin</p>
</header>

<section class="button-container">

  <form action="/analyze/pdf" method="post" enctype="multipart/form-data">
    <input type="file" name="file" required>
    <button class="analysis-btn">📄 PDF Analysis</button>
  </form>

  <form action="/analyze/image" method="post" enctype="multipart/form-data">
    <input type="file" name="file" required>
    <button class="analysis-btn">🖼️ Image Analysis</button>
  </form>

  <form action="/analyze/video" method="post" enctype="multipart/form-data">
    <input type="file" name="file" required>
    <button class="analysis-btn">🎥 Video Analysis</button>
  </form>

  <form action="/analyze/audio" method="post" enctype="multipart/form-data">
    <input type="file" name="file" required>
    <button class="analysis-btn">🎧 Audio Analysis</button>
  </form>

  <form action="/analyze/csv" method="post" enctype="multipart/form-data">
    <input type="file" name="file" required>
    <button class="analysis-btn">📊 Excel / CSV Analysis</button>
  </form>

  <!-- ✅ NEW: HISTORY BUTTON -->
  <form action="/history" method="get">
    <button class="analysis-btn">📜 View History</button>
  </form>

</section>

<footer>
  © 2025 AI Data Analysis Hub — Powered by Flask & Python
</footer>

</body>
</html>
